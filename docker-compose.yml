name: video-transcoder

services:
  # ============================================================
  # 1. Dedicated Redis Queue Service
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: video-processing-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - transcoder-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ============================================================
  # 2. NATS (JetStream) -- cross-service job intake/events
  # ============================================================
  nats:
    image: nats:2.14-alpine
    container_name: video-processing-nats
    restart: unless-stopped
    # -js enables JetStream, -sd sets a persistent store directory.
    # Development-only config: no auth/TLS. Add credentials/TLS before exposing beyond a
    # trusted internal network -- see NATS_USER/NATS_PASSWORD/NATS_TLS in .env.example.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - transcoder-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # 3. Video Processing Microservice
  # ============================================================
  video-processing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-processing-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Automatically points to the 'redis'/'nats' container services defined above
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
    # Passes all S3, AWS, QUEUE_NAME, and CONCURRENCY variables from your .env
    env_file:
      - .docker.env
    volumes:
      - transcoder_tmp:/tmp/transcoder
    networks:
      - transcoder-net
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # /ready (not /health) actually checks Redis connectivity.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Hardening: read-only root filesystem, all Linux capabilities dropped, no privilege
    # escalation. /tmp/transcoder is the only writable path the process needs at runtime
    # (it's mounted as its own volume above, which stays writable under read_only: true).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# ============================================================
# Networks & Persistent Volumes
# ============================================================
networks:
  transcoder-net:
    driver: bridge

volumes:
  redis_data:
  nats_data:
  transcoder_tmp:
